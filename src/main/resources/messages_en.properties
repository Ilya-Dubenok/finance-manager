# Help text. Every continuation line starts with \n, otherwise the leading indentation is dropped.
help.text==== Help ===\
\n\
\nHow to use\
\n  Enter a menu number and press Enter. Option 0 goes back or exits.\
\n  In any dialog, enter "cancel" to return to the menu.\
\n\
\nMenu\
\n  1. Operations - add income or an expense, list operations.\
\n  2. Categories and budgets - create, rename and delete categories, set budgets.\
\n  3. Statistics - summary and totals for selected categories.\
\n  4. Transfer - send money to another user by login.\
\n  5. Reports - export to JSON and CSV, import a JSON snapshot.\
\n  6. Help - this text.\
\n  7. Log out - switch to another user.\
\n\
\nFormats\
\n  Amount: 1500, 1500.50 or 1500,50, at most two decimal places.\
\n  Date: dd.mm.yyyy, for example 08.11.2026. Enter - today.\
\n  Period: two dates in the same format; Enter skips a bound.\
\n  Yes/no questions: answer "yes" or "no".\
\n\
\nExample: adding an expense\
\n  Category: Food\
\n  Amount: 500\
\n  Date (Enter - today):\
\n  Comment (Enter - skip): Lunch\
\n\
\nThings to know\
\n  - A budget is a single limit per expense category, without a period.\
\n    Remaining = limit minus all expenses of the category.\
\n  - A transfer is rejected if the balance is less than the transfer amount.\
\n  - A category with operations cannot be deleted.\
\n  - Before a category question the available categories are shown.\
\n  - Export without a path writes to the "exports" folder next to the data files.\
\n  - Import replaces the whole wallet, but only after you confirm and the file passes the checks.\
\n  - Data is saved when you log out and when you exit the application.
